name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build VSIX
        run: msbuild Miami26-VS.csproj /restore /p:Configuration=Release /v:minimal

      - uses: actions/upload-artifact@v4
        with:
          name: Miami26-VS
          path: bin/Release/Miami26-VS.vsix

      # Pushing a tag such as v2.2 publishes a GitHub release with the VSIX attached.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/Release/Miami26-VS.vsix
          generate_release_notes: true
